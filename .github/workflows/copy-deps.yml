name: copy-deps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout upstream xmake-repo
        uses: actions/checkout@v7
        with:
          repository: LiteLDev/xmake-repo
          path: upstream
          fetch-depth: 1

      - name: Copy versions folder
        run: |
          SRC="upstream/packages/l/levilamina/versions"
          DST="packages/l/levilamina-lib/versions"
          rm -rf "$DST"
          cp -r "$SRC" "$DST"


      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/l/levilamina/versions/
          git commit -m "chore(levilamina): copy deps from upstream"
          git push
